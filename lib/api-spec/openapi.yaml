  /blueprints/{id}/generate-ai-zones:
    post:
      operationId: generateBlueprintAiZones
      tags: [blueprints]
      summary: AI-assisted layout generation scoped to specific hand-drawn zones and chosen materials
      description: >-
        Generates elements only within the given zone polygons (canvas px coordinates), using only the
        selected materials/fixtures per zone, and merges the result into the blueprint's existing canvas —
        everything outside the zones is left untouched.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zones]
              properties:
                zones:
                  type: array
                  items:
                    $ref: "#/components/schemas/AiZoneInput"
                preview:
                  type: boolean
                  description: >-
                    When true, returns the merged canvas the generation would produce without saving it —
                    lets staff preview the result and Accept (call again with preview=false) or Discard.
      responses:
        "200":
          description: Blueprint with the zone-scoped AI-generated elements merged into its canvas (or, when preview=true, a preview of that result that has not been saved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"

