openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Divine Edge OS - Field Service Management Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: tags
    description: Business tag library
  - name: skipReasons
    description: Job skip reason configuration
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: dashboard
    description: Dashboard and summary data
  - name: customers
    description: Customer management
  - name: properties
    description: Property management
  - name: jobs
    description: Job/work order management
  - name: crews
    description: Crew management
  - name: inventory
    description: Inventory and parts management
  - name: invoices
    description: Invoice management
  - name: timeTracking
    description: Time tracking
  - name: employeeHistory
    description: Per-employee history (reviews, complaints, callbacks, custom forms)
  - name: blueprints
    description: Blueprint canvas
  - name: settings
    description: Tenant settings
  - name: plans
    description: Subscription plan management
  - name: servicePlans
    description: Sellable service plan templates, customer plans, and automated visit scheduling
  - name: efficiency
    description: P4P labor efficiency metrics
  - name: callbacks
    description: Quality assurance callback tracking
  - name: marketing
    description: Marketing campaign ROAS tracking
  - name: chemicals
    description: Chemical products, mixtures, and application records
  - name: equipment
    description: Equipment management, maintenance logs, and fuel tracking
  - name: tasks
    description: Internal to-do / task management, role-based assignment, and notifications
  - name: communications
    description: SMS, email, and communications log
  - name: estimates
    description: Estimates, approval workflow, and upsell add-ons
  - name: visits
    description: Standalone customer visits and follow-ups
  - name: billing
    description: Recurring billing templates and automation

paths:
  # STAFF JOB REQUESTS
  /job-requests:
    get:
      operationId: listJobRequests
      tags: [jobs]
      summary: List job requests visible to the authenticated staff member
      responses:
        "200":
          description: Job request list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobRequest" }
    post:
      operationId: createJobRequest
      tags: [jobs]
      summary: Submit a job request for manager review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRequestInput" }
      responses:
        "201":
          description: Job request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRequest" }
        "200":
          description: Existing idempotent job request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRequest" }
  /job-requests/{id}/approve:
    post:
      operationId: approveJobRequest
      tags: [jobs]
      summary: Approve a job request and create its scheduled job
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRequestApprovalInput" }
      responses:
        "200":
          description: Approved job request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRequest" }
  /job-requests/{id}/reject:
    post:
      operationId: rejectJobRequest
      tags: [jobs]
      summary: Reject a job request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRequestReviewInput" }
      responses:
        "200":
          description: Rejected job request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRequest" }
  /job-requests/{id}/request-clarification:
    post:
      operationId: requestJobRequestClarification
      tags: [jobs]
      summary: Request clarification for a job request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRequestReviewInput" }
      responses:
        "200":
          description: Job request needing clarification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRequest" }
  /job-requests/{id}/amend:
    post:
      operationId: amendJobRequest
      tags: [jobs]
      summary: Amend a clarification-requested job request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                notes: { type: string }
                idempotencyKey: { type: string, minLength: 1 }
      responses:
        "200":
          description: Amended job request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRequest" }

  /services:
    get:
      operationId: listServices
      tags: [jobs]
      summary: List tenant services
      parameters:
        - name: activeOnly
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Service list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }

  # COMMUNICATIONS
  /communications/customers/{customerId}:
    get:
      operationId: listCustomerMessages
      tags: [communications]
      summary: Get conversation thread for a customer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunicationsLogEntry"

  /communications/send:
    post:
      operationId: sendMessage
      tags: [communications]
      summary: Send an SMS or email to a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationsLogEntry"

  /communications/webhook:
    post:
      operationId: communicationsWebhook
      tags: [communications]
      summary: Inbound message webhook (OpenPhone / Grasshopper / Quo / Twilio)
      responses:
        "200":
          description: OK

  /communications/quo/calls:
    get:
      operationId: listQuoCalls
      tags: [communications]
      summary: List recent calls from the tenant's connected Quo phone number
      responses:
        "200":
          description: Call list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoCall"
        "400":
          description: Quo is not configured for this tenant

  /communications/quo/calls/{callId}/create-task:
    post:
      operationId: createTaskFromQuoCall
      tags: [communications]
      summary: Create an internal task from a Quo call (e.g. a missed call or voicemail follow-up)
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                assignedToRole:
                  type: string
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalTask"
        "400":
          description: Quo is not configured for this tenant
        "404":
          description: Call not found

  /jobs/{id}/send-reminder:
    post:
      operationId: sendJobReminder
      tags: [jobs]
      summary: Manually send a service reminder for a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendReminderInput"
      responses:
        "200":
          description: Reminder sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: array
                    items:
                      type: string
                  jobId:
                    type: integer

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  # DASHBOARD
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/jobs-by-status:
    get:
      operationId: getJobsByStatus
      tags: [dashboard]
      summary: Get job counts grouped by status
      responses:
        "200":
          description: Jobs by status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusCount"

  /dashboard/revenue-trend:
    get:
      operationId: getRevenueTrend
      tags: [dashboard]
      summary: Get revenue trend for last 30 days
      responses:
        "200":
          description: Revenue trend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenueTrendItem"

  # TAGS
  /tags:
    get:
      operationId: listTags
      tags: [tags]
      summary: List all business tags for the tenant
      responses:
        "200":
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessTag"
    post:
      operationId: createTag
      tags: [tags]
      summary: Create a new business tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                color: { type: string }
      responses:
        "201":
          description: Tag created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTag"
        "409":
          description: Duplicate tag name

  /tags/{id}:
    patch:
      operationId: updateTag
      tags: [tags]
      summary: Rename or recolor a tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                color: { type: string }
      responses:
        "200":
          description: Updated tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTag"
    delete:
      operationId: deleteTag
      tags: [tags]
      summary: Delete a tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # SKIP REASONS
  /skip-reasons:
    get:
      operationId: listSkipReasons
      tags: [skipReasons]
      summary: List all skip reasons for the tenant
      responses:
        "200":
          description: List of skip reasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkipReason"
    post:
      operationId: createSkipReason
      tags: [skipReasons]
      summary: Create a skip reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
                action: { type: string }
                actionConfig: { type: object, additionalProperties: true }
                isActive: { type: boolean }
                sortOrder: { type: integer }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkipReason"

  /skip-reasons/{id}:
    patch:
      operationId: updateSkipReason
      tags: [skipReasons]
      summary: Update a skip reason
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                action: { type: string }
                actionConfig: { type: object, additionalProperties: true }
                isActive: { type: boolean }
                sortOrder: { type: integer }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkipReason"
    delete:
      operationId: deleteSkipReason
      tags: [skipReasons]
      summary: Delete a skip reason
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # CUSTOMERS
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: hasReminderFailure
          in: query
          schema:
            type: boolean
          description: "Filter to customers whose last outbound reminder failed to send"
        - name: includeArchived
          in: query
          schema:
            type: boolean
          description: Include archived customers; archived customers are excluded by default
        - name: archivedOnly
          in: query
          schema:
            type: boolean
          description: Return only archived customers
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Permanently delete a customer (owner, office, or department manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Restricted to owner, office, or department manager roles
        "409":
          description: Customer has related records and cannot be permanently deleted

  /address-suggestions:
    get:
      operationId: getAddressSuggestions
      tags: [properties]
      summary: Suggest US service addresses near the tenant business address
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Address suggestions, limited to 200 miles when the business address can be geocoded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressSuggestionResponse"
        "400":
          description: Query is missing or too short

  /customers/{id}/setup-intent:
    post:
      operationId: createCustomerSetupIntent
      tags: [customers]
      summary: Create a Stripe SetupIntent for collecting a payment method
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: SetupIntent client secret and publishable key
          content:
            application/json:
              schema:
                type: object
                required: [clientSecret, publishableKey]
                properties:
                  clientSecret:
                    type: string
                  publishableKey:
                    type: string
        "503":
          description: Stripe not configured

  /customers/{id}/attach-payment-method:
    post:
      operationId: attachCustomerPaymentMethod
      tags: [customers]
      summary: Attach a confirmed Stripe PaymentMethod to a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethodId]
              properties:
                paymentMethodId:
                  type: string
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}/payment-method:
    get:
      operationId: getCustomerPaymentMethod
      tags: [customers]
      summary: Get the saved Stripe payment method for a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment method details (or null if none saved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPaymentMethod"
        "404":
          description: Customer not found

  # PROPERTIES
  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List all properties
      parameters:
        - name: customerId
          in: query
          schema:
            type: integer
        - name: q
          in: query
          schema:
            type: string
        - name: includeArchived
          in: query
          schema:
            type: boolean
          description: Include archived properties; archived properties are excluded by default
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Create a new property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Property created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get a property by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
    patch:
      operationId: updateProperty
      tags: [properties]
      summary: Update a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdate"
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
    delete:
      operationId: deleteProperty
      tags: [properties]
      summary: Permanently delete a property (owner, office, or department manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Restricted to owner, office, or department manager roles
        "409":
          description: Property has related records and cannot be permanently deleted

  /properties/{id}/geofence:
    patch:
      operationId: updateGeofencePin
      tags: [properties]
      summary: Update the geofence center pin for a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeofencePinUpdate"
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{id}/measurements:
    patch:
      operationId: updatePropertyMeasurements
      tags: [properties]
      summary: Save measurement polygons and total serviceable area for a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyMeasurementUpdate"
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/backfill-geocodes:
    post:
      operationId: backfillPropertyGeocodes
      tags: [properties]
      summary: Back-fill lat/lng for all properties that are missing coordinates (admin only)
      responses:
        "200":
          description: Summary of geocoding results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillGeocodesResult"
        "403":
          description: Forbidden

  /properties/{id}/geocode:
    get:
      operationId: geocodeProperty
      tags: [properties]
      summary: Geocode property address and return lat/lng with optional parcel boundary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Geocode result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodeResult"

  /properties/{id}/quotes:
    get:
      operationId: listPropertyQuotes
      tags: [properties]
      summary: List instant quotes for a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: createPropertyQuote
      tags: [properties]
      summary: Create an instant quote for a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Quote created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /quotes/{token}:
    get:
      operationId: getQuoteByToken
      tags: [properties]
      summary: Public endpoint — get quote details by token (no auth required)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quote with property details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteWithProperty"

  /quotes/{token}/respond:
    post:
      operationId: respondToQuote
      tags: [properties]
      summary: Public endpoint — customer approves or declines a quote
      parameters:
        - name: token
