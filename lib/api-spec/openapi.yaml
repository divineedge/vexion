                $ref: "#/components/schemas/PortalAuthResponse"
        "401":
          description: Invalid or expired OTP

  # PORTAL DATA (portal session token required)
  /portal/me:
    get:
      operationId: portalGetMe
      tags: [portal]
      summary: Get current portal customer profile
      responses:
        "200":
          description: Portal customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalCustomer"
        "401":
          description: Unauthorized

  /portal/summary:
    get:
      operationId: portalGetSummary
      tags: [portal]
      summary: Get portal home summary — upcoming jobs, recent invoices, unread alert count
      responses:
        "200":
          description: Portal summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSummary"

  /portal/jobs:
    get:
      operationId: portalListJobs
      tags: [portal]
      summary: List all jobs for the portal customer
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalJob"

  /portal/invoices:
    get:
      operationId: portalListInvoices
      tags: [portal]
      summary: List all invoices for the portal customer
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalInvoice"

  /portal/properties:
    get:
      operationId: portalListProperties
      tags: [portal]
      summary: List all properties for the portal customer
      responses:
        "200":
          description: Properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalProperty"

  /portal/alerts:
    get:
      operationId: portalListAlerts
      tags: [portal]
      summary: List customer alerts (technician issues and upsells)
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalAlert"

  /portal/alerts/{id}/respond:
    patch:
      operationId: portalRespondToAlert
      tags: [portal]
      summary: Respond to a customer alert (accept/decline)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalAlertResponse"
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalAlert"

  /portal/service-requests:
    post:
      operationId: portalCreateServiceRequest
      tags: [portal]
      summary: Submit a service request from the customer portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalServiceRequestInput"
      responses:
        "201":
          description: Service request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalJob"

  # STAFF — Job alerts panel
  /jobs/{id}/alerts:
    get:
      operationId: listJobAlerts
      tags: [jobs]
      summary: List customer alerts logged on a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerAlert"
    post:
      operationId: createJobAlert
      tags: [jobs]
      summary: Log a customer alert (issue or upsell) on a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAlertInput"
      responses:
        "201":
          description: Alert created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAlert"

  # STAFF — Customer portal link
  /customers/{id}/portal-link:
    get:
      operationId: getCustomerPortalLink
      tags: [customers]
      summary: Generate a pre-auth deep link for the customer portal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Portal link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalLinkResult"

