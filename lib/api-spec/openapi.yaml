      responses:
        "200":
          description: List of recurring series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringSeries"

  /jobs/{id}/skip-next:
    post:
      operationId: skipNextOccurrence
      tags: [jobs]
      summary: Skip the next scheduled occurrence of a recurring series
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reasonId:
                  type: integer
                  description: ID of a configured skip reason
                note:
                  type: string
                  description: Optional free-text note alongside the reason
      responses:
        "200":
          description: Updated series root job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found

