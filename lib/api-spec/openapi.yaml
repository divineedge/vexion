    delete:
      operationId: cancelRecurringSeries
      tags: [jobs]
      summary: Cancel a recurring series
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: scope
          in: query
          schema:
            $ref: "#/components/schemas/CancelSeriesScope"
          description: "forward=cancel from next onwards; all=cancel entire series"
      responses:
