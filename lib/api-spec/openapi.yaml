          type: string

    User:
      type: object
      required: [id, email, name, role, tenantId]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [super_admin, company_owner, office_manager, department_manager, crew_manager, technician]
        tenantId:
          type: integer
        planTier:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    UserInput:
      type: object
      required: [email, name, role]
