    post:
      operationId: generateBlueprintFromAi
      tags: [blueprints]
      summary: AI-assisted layout generation from a property map + description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, mode]
              properties:
                description:
                  type: string
                mode:
                  type: string
                  enum: [irrigation, concrete, landscape, general]
                propertyId:
                  type: integer
                name:
                  type: string
      responses:
        "200":
          description: Newly created blueprint with an AI-drafted layout
          content:
