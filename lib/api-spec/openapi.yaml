      summary: List internal tasks visible to the caller (admin/office see all; others see assigned/creatable/claimable)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: assigneeId
          in: query
          schema:
            type: integer
        - name: contextType
          in: query
          schema:
            type: string
        - name: scope
          in: query
          description: Pass 'mine' to force the caller-scoped view even for admin/office roles
          schema:
            type: string
        - name: includeArchived
          in: query
          schema:
            type: boolean
          description: "When true, includes archived tasks in the results (admin/office only). Defaults to false."
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InternalTask"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create an internal task (role-routing rules enforced server-side)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskInput"
