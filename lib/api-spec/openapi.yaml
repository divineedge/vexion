components:
  schemas:
    JobRequestInput:
      type: object
      required: [requestedStartDate, idempotencyKey]
      properties:
        customerId: { type: integer, nullable: true }
        propertyId: { type: integer, nullable: true }
        serviceId: { type: integer, nullable: true }
        requestedStartDate: { type: string, format: date-time }
        requestedEndDate: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        idempotencyKey: { type: string, minLength: 1 }
    JobRequestReviewInput:
      type: object
      required: [adminResponse, idempotencyKey]
      properties:
        adminResponse: { type: string, minLength: 1 }
        idempotencyKey: { type: string, minLength: 1 }
    JobRequestApprovalInput:
      type: object
      properties:
        scheduledAt: { type: string, format: date-time }
        adminResponse: { type: string }
    JobRequest:
      type: object
      required: [id, requesterId, status, requestedStartDate, idempotencyKey, createdAt, updatedAt]
      properties:
        id: { type: integer }
        requesterId: { type: integer }
        status: { type: string, enum: [pending, clarification_requested, approved, rejected] }
        customerId: { type: integer, nullable: true }
        propertyId: { type: integer, nullable: true }
        serviceId: { type: integer, nullable: true }
        requestedStartDate: { type: string, format: date-time }
        requestedEndDate: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        adminResponse: { type: string, nullable: true }
        reviewedById: { type: integer, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        approvedJobId: { type: integer, nullable: true }
        idempotencyKey: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        requesterName: { type: string, nullable: true }
        customerName: { type: string, nullable: true }
        propertyAddress: { type: string, nullable: true }
        serviceName: { type: string, nullable: true }
        reviewerName: { type: string, nullable: true }

    EstimateLineItem:
      type: object
      required: [id, description, qty, unitPrice, markup, discount, isOptional, acceptedByCustomer]
      properties:
        id:
          type: string
        serviceId:
          type: ["integer", "null"]
        description:
          type: string
        qty:
          type: number
        unitPrice:
          type: number
        markup:
          type: number
        discount:
          type: number
        isOptional:
          type: boolean
        optionalPitchLine:
          type: ["string", "null"]
        acceptedByCustomer:
          type: boolean

    Estimate:
      type: object
      required: [id, tenantId, status, visitMode, subtotal, tax, total, createdAt, updatedAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        customerId:
          type: ["integer", "null"]
        propertyId:
          type: ["integer", "null"]
        blueprintId:
          type: ["integer", "null"]
        assigneeId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [draft, sent, approved, declined, expired]
        visitMode:
          type: string
          enum: [scheduled, drop_by, drive_by]
        scheduledAt:
          type: ["string", "null"]
        expiresAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/EstimateLineItem"
        subtotal:
          type: number
        tax:
          type: number
        total:
          type: number
        approvalToken:
          type: ["string", "null"]
        sentAt:
          type: ["string", "null"]
        approvedAt:
          type: ["string", "null"]
        declinedAt:
          type: ["string", "null"]
        declineReason:
          type: ["string", "null"]
        estimatedDurationMin:
          type: ["integer", "null"]
          description: Expected job duration in minutes
        suppliesNeeded:
          type: array
          description: "Supplies the crew will need on site"
          items:
            $ref: "#/components/schemas/SupplyItem"
        convertedToJobId:
          type: ["integer", "null"]
        templateId:
          type: ["integer", "null"]
        templateName:
          type: ["string", "null"]
        customerName:
          type: ["string", "null"]
        assigneeName:
          type: ["string", "null"]
        propertyAddress:
          type: ["string", "null"]
        serviceName:
          type: ["string", "null"]
        paymentRequirement:
          type: string
          enum: [none, full, deposit_pct, deposit_fixed]
          description: "Payment required on acceptance: none=no payment, full=full total, deposit_pct=% of total, deposit_fixed=fixed $"
        depositValue:
          type: ["number", "null"]
          description: "Percentage (deposit_pct) or fixed dollar amount (deposit_fixed)"
        depositPaidAt:
          type: ["string", "null"]
          description: "ISO timestamp when the deposit/payment was collected"
        depositPaymentIntentId:
          type: ["string", "null"]
          description: "Stripe PaymentIntent ID for the deposit charge"
        isArchived:
          type: boolean
        archivedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
        updatedAt:
          type: string

    PublicInvoiceBusinessProfile:
      type: object
      properties:
        companyName:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        tagline:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        invoiceFooterText:
          type: ["string", "null"]

    PublicInvoice:
      allOf:
        - $ref: "#/components/schemas/Invoice"
      properties:
        businessProfile:
          $ref: "#/components/schemas/PublicInvoiceBusinessProfile"

    PublicEstimateBusinessProfile:
      type: object
      properties:
        companyName:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        tagline:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]

    PublicEstimate:
      allOf:
        - $ref: "#/components/schemas/Estimate"
      properties:
        required:
          type: array
          items:
            $ref: "#/components/schemas/EstimateLineItem"
        optional:
          type: array
          items:
            $ref: "#/components/schemas/EstimateLineItem"
        expired:
          type: boolean
        stripeEnabled:
          type: boolean
        stripePublishableKey:
          type: ["string", "null"]
        businessProfile:
          $ref: "#/components/schemas/PublicEstimateBusinessProfile"

    EstimatePipeline:
      type: object
      required: [pipelineValue, upsellRevenue]
      properties:
        pipelineValue:
          type: number
        upsellRevenue:
          type: number

    CreateEstimateInput:
      type: object
      properties:
        customerId:
          type: integer
        propertyId:
          type: integer
        blueprintId:
          type: integer
        assigneeId:
          type: integer
        visitMode:
          type: string
          enum: [scheduled, drop_by, drive_by]
        scheduledAt:
          type: string
        expiresAt:
          type: string
        notes:
          type: string
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/EstimateLineItem"
        templateId:
          type: integer
        estimatedDurationMin:
          type: integer
          description: Expected job duration in minutes
        suppliesNeeded:
          type: array
          description: "Supplies the crew will need on site"
          items:
            $ref: "#/components/schemas/SupplyItem"
        paymentRequirement:
          type: string
          enum: [none, full, deposit_pct, deposit_fixed]
        depositValue:
          type: number
          description: "Percentage (deposit_pct) or fixed dollar amount (deposit_fixed)"

    UpdateEstimateInput:
      type: object
      properties:
        customerId:
          type: integer
        propertyId:
          type: integer
        assigneeId:
          type: integer
        visitMode:
          type: string
          enum: [scheduled, drop_by, drive_by]
        scheduledAt:
          type: string
        expiresAt:
          type: string
        notes:
          type: string
        lineItems:
          type: array
